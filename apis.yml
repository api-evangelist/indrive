name: Indrive
description: 'inDrive is a global ride-hailing, delivery, and urban-services platform built around a
  peer-to-peer, name-your-price model in which passengers propose a fare and nearby drivers accept,
  counter, or decline it directly. Founded in 2012 by Arsen Tomsky in Yakutsk, Russia and now
  headquartered in Mountain View, California, the company operates across roughly 48 countries and more
  than 1,000 cities, with over 400 million app downloads. Beyond city rides it offers intercity
  transport, courier and freight delivery, on-demand task services, and driver lending. inDrive was
  added to the API Evangelist network as a portfolio company of Bond Capital and General Catalyst.
  inDrive does not publish a public developer API, OpenAPI specification, SDKs, or a developer portal;
  its GitHub organization hosts internal engineering frameworks and an engineering handbook rather than
  external API definitions.'
